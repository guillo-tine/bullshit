const k=9.0e9,e=1.60e-19,KEY='nys_regents_electrostatics_v2';let cur=-1,finalBank=[];
const F=x=>{let a=Math.abs(x);return a&& (a<.01||a>=10000)?x.toExponential(2).replace('e',' × 10^'):Number(x.toPrecision(3))};
const N=x=>{x=String(x).replace(/×\s*10\^/i,'e').replace(/x\s*10\^/i,'e').replace(/,/g,'');let m=x.match(/-?\d*\.?\d+(e[-+]?\d+)?/i);return m?+m[0]:NaN};
const clean=s=>String(s).toLowerCase().replace(/[^a-z0-9.\- ]/g,' ').replace(/\s+/g,' ').trim();

const topics=[
{id:'u0',title:'Unit 0: Regents Electrostatics Survival Skills',focus:'Learn how Regents electrostatics questions are built before learning the physics details.',learn:['Every calculation starts with givens, unknown, formula, substitution, final answer with unit. This is the scoring pattern for constructed responses.','Use the NY Physics Reference Table instead of memorizing everything: electrostatics mainly uses q=ne, Fe=kq1q2/r², Fe=qE, and W=qV.','Convert prefixes before substituting: milli=10^-3, micro=10^-6, nano=10^-9, pico=10^-12. Distances in Coulomb’s law must be meters.','Scientific notation is normal. 0.000004 C should be written as 4.0×10^-6 C. A calculator answer like 6E-4 means 6×10^-4.','Formula selection is usually obvious from givens: two charges and distance → Coulomb; charge and field → Fe=qE; charge and voltage/work → W=qV; total charge and elementary charge → q=ne.'],must:['Identify givens and unknown before doing algebra.','Units: C charge, N force, V potential difference, J work/energy, N/C electric field.','Rearrange symbolically first, then substitute numbers with units.','A numerical answer without a unit is incomplete on Regents.'],form:['q=ne','Fe=kq1q2/r²','Fe=qE','W=qV','k=9.0×10^9 N·m²/C²','e=1.60×10^-19 C'],traps:['Using μC as if it were C.','Using centimeters in Coulomb’s law.','Choosing a formula because it looks familiar instead of matching givens.','Rounding too early.'],worked:'Problem: A 2.0 μC charge is in a 300 N/C electric field. Find the electric force. Convert: 2.0 μC=2.0×10^-6 C. Equation: Fe=qE. Substitution: Fe=(2.0×10^-6 C)(300 N/C). Answer: Fe=6.0×10^-4 N.',qs:[kw('Which metric prefix means 10^-6?',['micro'], 'It is written with the Greek letter μ.', 'Micro means 10^-6, so 1 μC=1×10^-6 C.','skills'),q('Convert 7.5 μC to coulombs.',7.5e-6,'μ means multiply by 10^-6.','7.5 μC=7.5×10^-6 C.','C','skills'),q('Convert 3.0 cm to meters.',.03,'Centi means 10^-2.','3.0 cm=3.0×10^-2 m=0.030 m.','m','skills'),kw('A problem gives charge and electric field and asks force. Which formula should you use?',['fe qe','q e','f qe'], 'Look for force, charge, field.', 'Use Fe=qE because it connects force, charge, and electric field.','skills'),kw('A problem gives two charges and the distance between them. Which formula should you use?',['coulomb','kq','r'], 'Two charges plus distance is the inverse-square law.', 'Use Coulomb’s law, Fe=kq1q2/r².','skills'),kw('Name the three Regents calculation lines you should show.',['equation substitution answer','formula substitution unit'], 'What earns partial credit?', 'Show equation, substitution with units, and final answer with units.','skills'),q('A calculator displays 4.2E-5. Enter it as a decimal or scientific notation value.',4.2e-5,'E-5 means ×10^-5.','4.2E-5=4.2×10^-5=0.000042.','','skills'),kw('Which unit belongs to electric field strength?',['n/c','newton per coulomb'], 'Field is force per charge.', 'E=Fe/q, so the unit is N/C.','skills'),q('A force is 0.0060 N. Write the value in scientific notation.',6e-3,'Move the decimal three places.', '0.0060 N=6.0×10^-3 N.','N','skills'),kw('Why should you rearrange before substituting?',['unknown alone','solve','algebra'], 'Avoid arithmetic mistakes.', 'Rearranging first isolates the unknown and makes substitution clearer for Regents scoring.','skills')]},
{id:'u1',title:'Unit 1: Electric Charge Basics',focus:'Understand what charge is and how charges interact before calculating.',learn:['Matter contains positive protons, negative electrons, and neutral neutrons. A neutral object has equal total positive and negative charge, not zero particles.','Objects become charged mainly by gaining or losing electrons. Losing electrons leaves a net positive charge; gaining electrons leaves a net negative charge.','Like charges repel and opposite charges attract. A charged object can also attract a neutral object because charges inside the neutral object shift slightly; this is polarization.','Charge is conserved: in an isolated system the total charge before and after is the same. Charge is also quantized: any net charge is a whole-number multiple of e=1.60×10^-19 C.','The number of elementary charges is n=q/e. Regents questions often ask how many electrons were transferred from a total charge.'],must:['Positive = electron deficit; negative = electron excess.','Neutral objects can be attracted by charged objects.','Total charge is conserved during transfer.','Net charge comes in multiples of 1.60×10^-19 C.'],form:['q=ne','n=q/e','e=1.60×10^-19 C'],traps:['Neutral does not mean no protons or electrons.','A fraction of an electron cannot be transferred.','Attraction does not prove two objects are oppositely charged; one may be neutral.'],worked:'Problem: How many electrons make a charge magnitude of 4.80×10^-18 C? Equation: n=q/e. Substitution: n=(4.80×10^-18 C)/(1.60×10^-19 C). Answer: n=30 electrons.',qs:[kw('Two negative objects are brought near each other. What happens?',['repel'], 'Like charges do this.', 'Like charges repel, so two negative objects repel.','charge'),kw('A neutral object has what relationship between protons and electrons?',['equal','same'], 'Neutral means balanced.', 'A neutral object has equal amounts of positive and negative charge.','charge'),kw('If an object loses electrons, what is its net charge?',['positive'], 'Electrons are negative.', 'Losing negative charge leaves the object positive.','charge'),kw('Can a charged object attract a neutral object? Answer yes or no and name the effect.',['yes polarization'], 'Charges shift inside the neutral object.', 'Yes. Polarization separates charge slightly in the neutral object, causing attraction.','charge'),kw('What law says total charge is not created or destroyed?',['conservation'], 'It is a conservation law.', 'Conservation of charge says total charge stays constant in an isolated system.','charge'),q('How many elementary charges are in 3.20×10^-18 C?',20,'Use n=q/e.','n=(3.20×10^-18 C)/(1.60×10^-19 C)=20 elementary charges.','charges','charge'),q('What is the charge magnitude of 6 electrons?',9.6e-19,'Use q=ne.','q=ne=(6)(1.60×10^-19 C)=9.60×10^-19 C.','C','charge'),kw('Why are charges said to be quantized?',['whole multiples','integer','elementary'], 'Think whole electrons.', 'Net charge exists in whole-number multiples of the elementary charge e.','charge'),kw('If two objects attract, must both be charged?',['no'], 'A neutral object can be attracted.', 'No. One charged object can attract a neutral object by polarization.','charge'),kw('An object gains electrons. Is it positive or negative?',['negative'], 'It gained negative particles.', 'Gaining electrons makes the object negatively charged.','charge')],gen:'charge'},
{id:'u2',title:'Unit 2: Conductors, Insulators, and Charging',focus:'Explain how objects become charged and why electrons are the mobile charges in solids.',learn:['Conductors, especially metals, allow electrons to move easily. Insulators hold electrons more tightly, so charge does not move freely through the material.','In solid materials, protons are locked in atomic nuclei. Electrons are the charges that usually transfer or redistribute.','Charging by friction occurs when rubbing transfers electrons from one material to another. The two objects end with opposite net charges.','Charging by contact/conduction occurs when a charged object touches another object and electrons transfer. Identical conductors share charge after contact.','Charging by induction charges an object without direct contact with the charged rod. A nearby charge polarizes a conductor; grounding lets electrons enter or leave; removing the ground then the rod leaves a net charge.','Grounding means connecting an object to Earth, a huge reservoir of charge. Electrons can flow to or from Earth.'],must:['Conductor: mobile electrons. Insulator: charges not free to move.','Friction and contact require electron transfer.','Induction can charge without touching the charged rod.','Grounding provides a path for electron flow.'],form:['No new formula: use conservation of charge and electron transfer ideas.'],traps:['Saying protons move through a metal wire in electrostatics.','Confusing polarization with permanent charging.','Forgetting that contact charging often leaves both conductors with the same sign.','In induction, order matters: remove ground before removing charged rod.'],worked:'Example: A negative rod touches a neutral metal sphere. Electrons move from the rod onto the sphere. After separation the sphere has excess electrons, so it is negative. This is charging by contact/conduction.',qs:[kw('Which type of material allows electrons to move freely: conductor or insulator?',['conductor'], 'Metals are examples.', 'A conductor allows electrons to move freely.','charging'),kw('In solids, which particles usually move during charging: electrons or protons?',['electrons'], 'Protons are in nuclei.', 'Electrons move; protons are bound in atomic nuclei.','charging'),kw('Rubbing a balloon on hair is charging by what method?',['friction'], 'Rubbing is the clue.', 'Charging by friction transfers electrons by rubbing.','charging'),kw('Touching a charged rod to a neutral sphere is charging by what method?',['contact','conduction'], 'Touching is the clue.', 'Charging by contact, or conduction, occurs when charge transfers by touching.','charging'),kw('Charging a conductor without touching it with the charged rod is called what?',['induction'], 'Usually involves grounding.', 'Charging by induction can leave a net charge without direct contact with the charged rod.','charging'),kw('What does grounding provide for electrons?',['path','earth','flow'], 'Earth is a charge reservoir.', 'Grounding provides a conducting path so electrons can flow to or from Earth.','charging'),kw('After a negative rod contacts a neutral metal sphere, the sphere is usually what sign?',['negative'], 'Electrons move onto the sphere.', 'The sphere gains excess electrons and becomes negative.','charging'),kw('A neutral conductor has charges separated by a nearby charged rod but no net charge. What is this called?',['polarization'], 'Separated, not transferred.', 'This charge separation is polarization.','charging'),kw('If identical metal spheres with charges +6 C and 0 C touch and separate, what charge is on each?', ['3'], 'Total charge is shared equally.', 'Total charge is +6 C, so identical spheres share it: +3 C on each.','charging'),kw('Why does an insulator hold localized charge better than a conductor?',['electrons not free','not move','tightly'], 'Charges cannot easily spread.', 'In an insulator, electrons are not free to move throughout the material, so charge can remain localized.','charging')]},
{id:'u3',title:'Unit 3: Coulomb’s Law',focus:'Calculate and reason about electrostatic force between two charges.',learn:['Coulomb’s law gives the magnitude of the force between two charged particles or spherical charged objects: Fe=kq1q2/r². Use charge magnitudes in coulombs and distance in meters.','The distance r is measured between centers of the charged objects, not between surfaces.','The force is directly proportional to each charge. Doubling q1 doubles Fe; doubling both charges makes Fe four times larger.','The force is inversely proportional to distance squared. Doubling distance makes force 1/4; tripling distance makes force 1/9.','The formula gives magnitude. Direction is decided separately: like signs repel, opposite signs attract.','Electric force and gravitational force are both inverse-square forces, but electric force can attract or repel and is usually much stronger for charged particles.'],must:['k=9.0×10^9 N·m²/C².','Use meters and coulombs.','r is squared.','Magnitude from formula; attraction/repulsion from signs.'],form:['Fe=kq1q2/r²','k=9.0×10^9 N·m²/C²'],traps:['Forgetting to square r.','Using μC directly instead of converting to C.','Using surface-to-surface distance for spheres.','Putting a negative sign into the magnitude calculation and reporting negative force.'],worked:'Problem: q1=2.0×10^-6 C, q2=3.0×10^-6 C, r=0.50 m. Equation: Fe=kq1q2/r². Substitution: Fe=(9.0×10^9)(2.0×10^-6 C)(3.0×10^-6 C)/(0.50 m)². Answer: Fe=0.216 N. If signs are opposite, the force is attractive.',qs:[kw('Two positive charges exert what kind of force on each other?',['repel'], 'Like charges.', 'Like charges repel.','coulomb'),kw('A positive and a negative charge exert what kind of force on each other?',['attract'], 'Opposite charges.', 'Opposite charges attract.','coulomb'),kw('For two charged spheres, r in Coulomb’s law is measured between what points?',['centers','center'], 'Not the gap between surfaces.', 'Use the distance between centers.','coulomb'),q('If distance doubles and charges stay the same, force becomes what fraction of the original?',.25,'Inverse-square relationship.', 'Fe∝1/r², so doubling r gives 1/2²=1/4 of the original force.','fraction','coulomb'),q('If q1 triples and everything else stays the same, force changes by what factor?',3,'Directly proportional to q1.', 'Fe is directly proportional to q1, so the force triples.','factor','coulomb'),q('If both charges double and r is unchanged, force changes by what factor?',4,'Multiply the charge factors.', 'Fe∝q1q2, so 2×2=4 times larger.','factor','coulomb'),q('Find Fe for q1=1.0×10^-6 C, q2=2.0×10^-6 C, r=0.30 m.',.2,'Use Fe=kq1q2/r².', 'Fe=(9.0×10^9)(1.0×10^-6 C)(2.0×10^-6 C)/(0.30 m)²=0.20 N.','N','coulomb'),kw('Does Coulomb’s law calculation give magnitude, direction, or both?',['magnitude'], 'Signs decide direction separately.', 'The formula gives force magnitude; attraction/repulsion gives direction.','coulomb'),q('If r triples, force becomes what fraction of original?',1/9,'Use 1/r².', 'Tripling r gives 1/3²=1/9 of the original force.','fraction','coulomb'),kw('Compared with gravity, electric force can attract and also what?',['repel'], 'Gravity only attracts in Regents physics.', 'Electric force can attract or repel; gravity only attracts.','coulomb')],gen:'coul'},
{id:'u4',title:'Unit 4: Electric Fields',focus:'Interpret electric field strength as force per charge and read field-line diagrams.',learn:['An electric field exists at a location if a charge placed there would experience an electric force. Field strength is force per unit charge.','The reference-table relationship is Fe=qE. Rearranged forms are E=Fe/q and q=Fe/E.','The unit N/C means newtons of force per coulomb of charge. A 200 N/C field exerts 200 N on each coulomb of positive test charge.','Electric field direction is defined as the direction of force on a positive test charge. A negative charge experiences force opposite the field direction.','Field lines point away from positive source charges and toward negative source charges. More closely spaced field lines mean a stronger field.','A test charge should be small enough that it does not significantly change the field being measured.'],must:['E=Fe/q and Fe=qE.','Field direction follows a positive test charge.','Negative charges feel force opposite E.','Close field lines = strong field.'],form:['Fe=qE','E=Fe/q','q=Fe/E','unit of E=N/C'],traps:['Confusing field direction with electron force direction.','Saying field lines cross; they do not in Regents diagrams.','Forgetting that field exists even before the test charge is placed there.'],worked:'Problem: A 3.0×10^-6 C charge experiences a 0.012 N force. Equation: E=Fe/q. Substitution: E=(0.012 N)/(3.0×10^-6 C). Answer: E=4.0×10^3 N/C.',qs:[kw('Electric field direction is defined by the force on what sign of test charge?',['positive'], 'Definition.', 'Electric field points in the direction a positive test charge would accelerate.','field'),kw('Field lines near a positive charge point inward or outward?',['outward','away'], 'They leave positive charges.', 'Field lines point away from positive charges.','field'),kw('Field lines near a negative charge point inward or outward?',['inward','toward'], 'They enter negative charges.', 'Field lines point toward negative charges.','field'),kw('Where field lines are closer together, the field is stronger or weaker?',['stronger'], 'Line density means field strength.', 'Closer field lines represent a stronger electric field.','field'),q('A 2.0×10^-6 C charge in a 500 N/C field feels what force?',1.0e-3,'Use Fe=qE.', 'Fe=qE=(2.0×10^-6 C)(500 N/C)=1.0×10^-3 N.','N','field'),q('A 0.020 N force acts on a 4.0×10^-6 C charge. Find E.',5000,'Use E=Fe/q.', 'E=Fe/q=(0.020 N)/(4.0×10^-6 C)=5.0×10^3 N/C.','N/C','field'),kw('A negative charge in a rightward electric field feels force in what direction?',['left'], 'Negative is opposite.', 'A negative charge experiences force opposite the field, so left.','field'),kw('Can electric field exist at a point even if no test charge is there?',['yes'], 'The test charge detects the field.', 'Yes. The field is a property of the space around source charges.','field'),q('A charge feels 0.60 N in a 200 N/C field. Find q.',.003,'Use q=Fe/E.', 'q=Fe/E=(0.60 N)/(200 N/C)=3.0×10^-3 C.','C','field'),kw('Do electric field lines cross in Regents field diagrams?',['no'], 'A point cannot have two field directions.', 'No. Field lines do not cross because the field has one direction at each point.','field')],gen:'field'},
{id:'u5',title:'Unit 5: Uniform Electric Fields and Parallel Plates',focus:'Apply electric field ideas to oppositely charged parallel plates.',learn:['Between ideal oppositely charged parallel plates, the electric field is uniform: same magnitude and direction at all points away from edges.','Field lines go from the positive plate to the negative plate. They are straight, parallel, and evenly spaced in the ideal region.','A positive charge between plates feels force in the direction of the field, toward the negative plate. A negative charge feels force opposite the field, toward the positive plate.','Use Fe=qE for the force on any charge in the uniform field. If the particle is free to move, the electric force causes acceleration.','Regents questions are qualitative: direction of force/motion, same field at different points, and simple Fe=qE calculations. Avoid capacitor formulas; they are not part of this unit.'],must:['Uniform field = same E throughout ideal plate region.','Direction: positive plate → negative plate.','Positive charge force with E; negative charge force opposite E.','Fe=qE still applies.'],form:['Fe=qE','E=Fe/q'],traps:['Thinking field strength changes just because a point is closer to one plate.','Forgetting an electron accelerates toward the positive plate.','Using AP capacitor formulas not on Regents.'],worked:'Example: The electric field between plates points right. A proton feels force right. An electron feels force left. If q=4.0×10^-6 C and E=200 N/C, Fe=(4.0×10^-6 C)(200 N/C)=8.0×10^-4 N.',qs:[kw('Between parallel plates, electric field points from which plate to which plate?',['positive negative'], 'Field lines leave + and enter -.', 'The field points from the positive plate toward the negative plate.','plates'),kw('A proton between plates feels force in the same direction as E or opposite E?',['same'], 'Proton is positive.', 'A positive charge feels force in the direction of the electric field.','plates'),kw('An electron between plates feels force in the same direction as E or opposite E?',['opposite'], 'Electron is negative.', 'A negative charge feels force opposite the electric field.','plates'),kw('At two points between ideal parallel plates, field strength is the same or different?',['same'], 'Uniform field.', 'The field is uniform, so ideal field strength is the same at both points.','plates'),q('A +5.0×10^-6 C charge is in a 300 N/C uniform field. Find Fe.',1.5e-3,'Use Fe=qE.', 'Fe=qE=(5.0×10^-6 C)(300 N/C)=1.5×10^-3 N.','N','plates'),kw('If the top plate is positive and bottom plate is negative, what direction is E?',['down','downward'], 'From + to -.', 'The field points downward from the positive top plate to the negative bottom plate.','plates'),kw('In a uniform field, are field lines evenly spaced or crowded near one plate?',['evenly','parallel'], 'Uniform means constant.', 'Uniform field lines are parallel and evenly spaced.','plates'),kw('A negative drop is placed in a downward electric field. What direction is the electric force?',['up','upward'], 'Negative means opposite field.', 'The force on a negative charge is upward, opposite the downward field.','plates'),q('A charge feels 0.0040 N in a 800 N/C field. Find q.',5e-6,'Use q=Fe/E.', 'q=Fe/E=(0.0040 N)/(800 N/C)=5.0×10^-6 C.','C','plates'),kw('Are capacitor energy equations required for Regents electrostatics here?',['no'], 'This is not AP/capacitors.', 'No. Regents electrostatics uses field and force ideas, especially Fe=qE.','plates')],gen:'field'},
{id:'u6',title:'Unit 6: Potential Difference, Work, and Electrical Energy',focus:'Use voltage as energy per charge and convert electronvolts.',learn:['Electric potential difference, or voltage, tells how much work or energy is transferred per coulomb of charge. One volt equals one joule per coulomb.','The Regents relationship is W=qV. W is work or electrical energy in joules, q is charge in coulombs, and V is potential difference in volts.','Rearrange as V=W/q or q=W/V. If the problem gives energy and charge, use voltage; if it gives charge and voltage, use work.','An electronvolt is a unit of energy, not voltage. 1 eV=1.60×10^-19 J. Multiply eV by 1.60×10^-19 to get joules; divide joules by 1.60×10^-19 to get eV.','Regents questions may describe energy gained or lost by a charge moving through a potential difference. Use magnitude unless direction/sign is specifically requested.'],must:['W=qV.','1 V=1 J/C.','1 eV=1.60×10^-19 J.','Use coulombs, joules, and volts consistently.'],form:['W=qV','V=W/q','q=W/V','1 eV=1.60×10^-19 J'],traps:['Calling an electronvolt a voltage.','Using elementary charge e instead of the given charge.','Forgetting to convert eV to joules when asked for SI units.'],worked:'Problem: A 0.50 C charge moves through 12 V. Equation: W=qV. Substitution: W=(0.50 C)(12 V). Answer: W=6.0 J.',qs:[kw('One volt equals one joule per what?',['coulomb'], 'Voltage is energy per charge.', '1 V=1 J/C, one joule per coulomb.','voltage'),kw('Which formula relates work, charge, and voltage?',['w qv','qv'], 'Reference table.', 'Use W=qV.','voltage'),q('A 0.50 C charge moves through 6.0 V. Find work.',3.0,'Use W=qV.', 'W=qV=(0.50 C)(6.0 V)=3.0 J.','J','voltage'),q('A 12 J energy change occurs for 3.0 C of charge. Find V.',4.0,'Use V=W/q.', 'V=W/q=(12 J)/(3.0 C)=4.0 V.','V','voltage'),q('How much charge moves if 18 J of work occurs through 9.0 V?',2.0,'Use q=W/V.', 'q=W/V=(18 J)/(9.0 V)=2.0 C.','C','voltage'),q('Convert 3.0 eV to joules.',4.8e-19,'Multiply by 1.60×10^-19.', '3.0 eV(1.60×10^-19 J/eV)=4.8×10^-19 J.','J','voltage'),q('Convert 8.0×10^-19 J to eV.',5.0,'Divide by 1.60×10^-19.', '(8.0×10^-19 J)/(1.60×10^-19 J/eV)=5.0 eV.','eV','voltage'),kw('Is an electronvolt a unit of charge, voltage, or energy?',['energy'], 'It converts to joules.', 'An electronvolt is a unit of energy.','voltage'),q('A 2.0 μC charge moves through 50 V. Find W.',1.0e-4,'Convert μC first, then W=qV.', '2.0 μC=2.0×10^-6 C; W=(2.0×10^-6 C)(50 V)=1.0×10^-4 J.','J','voltage'),kw('If voltage doubles and charge is unchanged, work changes by what factor?',['double','2','two'], 'W is directly proportional to V.', 'W=qV, so doubling V doubles W.','voltage')],gen:'work'},
{id:'u7',title:'Unit 7: Mixed Regents Electrostatics Review',focus:'Practice choosing equations and explaining proportional reasoning.',learn:['Mixed Regents questions test formula choice more than advanced math. Circle or list givens and units first.','If you see q1, q2, and r, choose Fe=kq1q2/r². If you see q and E, choose Fe=qE. If you see q and V or W, choose W=qV. If you see elementary charges, choose q=ne.','For proportional reasoning, write the relationship: Fe∝q1q2/r², Fe∝qE, W∝qV. Apply only the stated change.','For conceptual direction questions, separate magnitude from direction: Coulomb magnitude from formula, sign interaction from like/opposite; electric field force direction from charge sign.','Check units at the end. N means force, N/C means field, J means work/energy, V means potential difference.'],must:['Givens decide formula.','Use proportional relationships for graph-style questions.','Always include units in final answers.','Review weak topics from your dashboard.'],form:['q=ne','Fe=kq1q2/r²','Fe=qE','W=qV'],traps:['Using Coulomb’s law when the problem gives a uniform field.','Using W=qV for force.','Ignoring inverse-square distance changes.','Mixing eV and V.'],worked:'Problem gives q=3.0 C and V=4.0 V and asks energy. Choose W=qV, not Coulomb’s law. W=(3.0 C)(4.0 V)=12 J.',qs:[kw('A problem gives q1, q2, and r. Which formula should be used?',['coulomb','kq','r'], 'Two charges and distance.', 'Use Coulomb’s law: Fe=kq1q2/r².','mixed'),kw('A problem gives Fe and q and asks E. Which formula should be used or rearranged?',['e fe q','f q'], 'Field is force per charge.', 'Use E=Fe/q from Fe=qE.','mixed'),kw('A problem gives q and V and asks energy. Which formula should be used?',['w qv','qv'], 'Voltage connects to work.', 'Use W=qV.','mixed'),q('If both charges double and distance stays the same, Coulomb force changes by what factor?',4,'Direct with both charges.', 'Fe∝q1q2, so 2×2=4.','factor','mixed'),q('If distance is cut in half, Coulomb force changes by what factor?',4,'Inverse square: 1/(1/2)^2.', 'Halving r makes Fe 1/(1/2)²=4 times larger.','factor','mixed'),q('A charge of 2.0 C gains 10 J. Find voltage.',5,'Use V=W/q.', 'V=W/q=(10 J)/(2.0 C)=5.0 V.','V','mixed'),q('A 4.0×10^-6 C charge feels 0.0080 N. Find E.',2000,'Use E=Fe/q.', 'E=(0.0080 N)/(4.0×10^-6 C)=2.0×10^3 N/C.','N/C','mixed'),kw('A negative particle in a leftward field feels force which way?',['right'], 'Negative is opposite.', 'A negative charge feels force opposite the field, so right.','mixed'),kw('Which final unit tells you the answer is work/energy?',['joule','j'], 'SI energy unit.', 'Work/energy is measured in joules, J.','mixed'),kw('Why is 5 eV not the same kind of quantity as 5 V?',['energy voltage','ev energy'], 'eV converts to joules.', 'eV is energy; V is potential difference.','mixed')]},
{id:'u8',title:'Unit 8: Final Electrostatics Mastery Check',focus:'A 20-question mixed quiz. After checking, use weak tags to choose a review order.',learn:['This final check mixes concepts, formula selection, proportional reasoning, unit conversion, and constructed-response style calculations.','Use your dashboard after the quiz. Any topic below 70% should be reviewed before retaking.','On calculation items, write equation, substitution with units, and final answer with unit even if the input box only checks the final value.'],must:['Slow down and identify givens.','Choose the simplest Regents formula.','Check powers of ten and units.','Retake with New 20-question quiz until mastery is consistent.'],form:['q=ne','Fe=kq1q2/r²','Fe=qE','W=qV'],traps:['Formula panic.','Missing unit conversions.','Forgetting direction rules for negative charges.'],worked:'Example strategy: q and E given, force asked → Fe=qE. Substitute with units, then decide direction from the charge sign.',qs:[],final:true}
];
function fresh(){return{done:{},notes:{},answers:{},stat:{},miss:{}}}let st=JSON.parse(localStorage.getItem(KEY)||'null')||fresh();function save(){localStorage.setItem(KEY,JSON.stringify(st));progress()}function S(id){return st.stat[id]||(st.stat[id]={c:0,a:0})}function progress(){let done=topics.filter(t=>st.done[t.id]).length,p=Math.round(done/topics.length*100),tot={c:0,a:0};topics.forEach(t=>{let s=S(t.id);tot.c+=s.c;tot.a+=s.a});pbar.style.width=p+'%';ptext.textContent=p+'% lessons complete | '+tot.c+'/'+tot.a+' questions correct'}
function reference(){ref.innerHTML='<ul class="toc"><li>q=ne; e=1.60×10^-19 C</li><li>Fe=kq1q2/r²; k=9.0×10^9 N·m²/C²</li><li>Fe=qE; E in N/C</li><li>W=qV; 1 V=1 J/C</li><li>1 eV=1.60×10^-19 J</li><li>m=10^-3, μ=10^-6, n=10^-9, p=10^-12</li></ul>'}
function menu(){let s=clean(searchEl.value);menuEl.innerHTML='<b>Course Menu</b><span class="lnk '+(cur<0?'sel':'')+'" onclick="cur=-1;render()">Dashboard</span>'+topics.map((t,i)=>!s||clean(t.title+' '+t.focus+' '+t.must.join(' ')).includes(s)?'<span class="lnk '+(cur==i?'sel':'')+'" onclick="cur='+i+';render()">'+t.title+(st.done[t.id]?' <span class=done>✓</span>':'')+'</span>':'').join('')}
function dashboard(){progress();menu();let rows=topics.map(t=>{let s=S(t.id),m=s.a?Math.round(100*s.c/s.a):0;return '<tr class="'+(s.a&&m<70?'weak':'')+'"><td>'+t.title+'</td><td>'+(st.done[t.id]?'yes':'no')+'</td><td>'+m+'%</td><td>'+s.c+'/'+s.a+'</td></tr>'}).join('');let weak=topics.filter(t=>{let s=S(t.id);return s.a&&s.c/s.a<.7}).map(t=>'<span class=pill>'+t.title+'</span>').join(' ')||'None yet; answer questions to diagnose.';let misses=Object.entries(st.miss||{}).sort((a,b)=>b[1]-a[1]).map(x=>'<span class=pill>'+x[0]+': '+x[1]+'</span>').join(' ')||'No missed-question tags yet.';app.innerHTML='<h2>Dashboard</h2><div class=grid><div class=box><b>Overall progress</b><p>'+ptext.textContent+'</p></div><div class="box weak"><b>Weak lessons</b><p>'+weak+'</p></div><div class=box><b>Most missed skills</b><p>'+misses+'</p></div></div><h3>Mastery by topic</h3><table><tr><th>Topic</th><th>Complete</th><th>Mastery</th><th>Correct/Attempted</th></tr>'+rows+'</table><div class="box note"><b>How to study:</b><ol><li>Read the lesson first.</li><li>Cover the worked example and redo it.</li><li>Answer all practice questions.</li><li>Review explanations for misses.</li><li>Retake randomized questions until the topic is above 80%.</li></ol></div>'}
function render(){if(cur<0)return dashboard();if(topics[cur].final&&!finalBank.length)makeFinal();progress();menu();let t=topics[cur],s=S(t.id),qs=t.final?finalBank:t.qs;app.innerHTML='<h2>'+t.title+'</h2><p><b>Focus:</b> '+t.focus+'</p><div class=nav><button onclick="cur=Math.max(0,cur-1);render()">Previous</button><button onclick="cur=Math.min(topics.length-1,cur+1);render()">Next</button><button onclick="st.done[\''+t.id+'\']=1;save();render()">Mark Complete</button>'+(t.gen?'<button onclick="addRandom()">New Random Question</button>':'')+(t.final?'<button onclick="makeFinal();render()">New 20-question quiz</button>':'')+'</div><div class="box lesson"><h3>Teach Me</h3>'+t.learn.map(x=>'<p>'+x+'</p>').join('')+'</div><div class=grid><div class=box><h3>Must-know facts</h3><ul>'+t.must.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class=box><h3>Formula card</h3><ul>'+t.form.map(x=>'<li class=mono>'+x+'</li>').join('')+'</ul></div><div class=box><h3>Common Regents traps</h3><ul>'+t.traps.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div><div class="box note"><h3>Worked Regents Example</h3><p>'+t.worked+'</p></div><h3>Practice and Quiz</h3><p class=small>Numerical answers accept about 2% tolerance. For calculations, explanations show equation, substitution, and final unit.</p><div id=qs>'+qs.map((x,i)=>qhtml(x,i,t.id)).join('')+'</div><div class=box><b>Autosaved Notes</b><textarea oninput="st.notes[\''+t.id+'\']=this.value;save()">'+esc(st.notes[t.id]||'')+'</textarea></div><p class=small>Topic mastery: '+(s.a?Math.round(100*s.c/s.a):0)+'% ('+s.c+'/'+s.a+')</p>'}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function qhtml(x,i,id){let key=id+'_'+i,v=esc(st.answers[key]||'');return '<div class=q><b>Q'+(i+1)+'.</b> '+x.txt+'<br><input class=ans id=a'+i+' value="'+v.replace(/"/g,'&quot;')+'" oninput="st.answers[\''+key+'\']=this.value;save()" placeholder="type answer"><br><button onclick="check('+i+')">Check Answer</button><button onclick="hint('+i+')">Show Hint</button><div id=r'+i+'></div></div>'}
function currentQs(){return topics[cur].final?finalBank:topics[cur].qs}function check(i){let x=currentQs()[i],v=document.getElementById('a'+i).value,ok=false;if(typeof x.ans=='number'){let n=N(v);ok=isFinite(n)&&Math.abs(n-x.ans)<=Math.max(Math.abs(x.ans)*.02,1e-12)}else{let c=clean(v),groups=x.ans.kw;ok=groups.every(g=>String(g).split('|').some(w=>c.includes(clean(w))))}let s=S(topics[cur].id);s.a++;if(ok)s.c++;else{st.miss[x.tag||topics[cur].id]=(st.miss[x.tag||topics[cur].id]||0)+1}save();document.getElementById('r'+i).innerHTML='<p class="'+(ok?'ok':'bad')+'">'+(ok?'Correct':'Not yet')+'</p><p><b>Full explanation:</b> '+x.exp+(x.unit?' <b>Correct unit:</b> '+x.unit+'.':'')+'</p>'}
function hint(i){document.getElementById('r'+i).innerHTML='<p><b>Hint:</b> '+currentQs()[i].hint+'</p>'}
function R(a,b){return +(a+Math.random()*(b-a)).toPrecision(2)}function gen(type){if(type=='charge'){let n=Math.floor(R(8,90)),val=n*e;return q('Random: A charge has magnitude '+F(val)+' C. How many elementary charges were transferred?',n,'Use n=q/e.','Equation: n=q/e. Substitution: n=('+F(val)+' C)/(1.60×10^-19 C). Final answer: '+n+' elementary charges.','charges','charge')}if(type=='coul'){let q1=R(1,9)*1e-6,q2=R(1,9)*1e-6,r=R(.20,.95),ans=k*q1*q2/(r*r);return q('Random: q1='+F(q1)+' C, q2='+F(q2)+' C, r='+r+' m. Find the electrostatic force magnitude.',ans,'Use Fe=kq1q2/r² with r in meters.','Equation: Fe=kq1q2/r². Substitution: Fe=(9.0×10^9)('+F(q1)+' C)('+F(q2)+' C)/('+r+' m)². Final answer: Fe='+F(ans)+' N.','N','coulomb')}if(type=='field'){let ch=R(1,9)*1e-6,ef=R(120,950),ans=ch*ef;return q('Random: A '+F(ch)+' C charge is in an electric field of '+ef+' N/C. Find Fe.',ans,'Use Fe=qE.','Equation: Fe=qE. Substitution: Fe=('+F(ch)+' C)('+ef+' N/C). Final answer: Fe='+F(ans)+' N.','N','field')}let ch=R(.2,5),v=R(3,30),ans=ch*v;return q('Random: A '+ch+' C charge moves through a potential difference of '+v+' V. Find W.',ans,'Use W=qV.','Equation: W=qV. Substitution: W=('+ch+' C)('+v+' V). Final answer: W='+F(ans)+' J.','J','voltage')}
function addRandom(){topics[cur].qs.push(gen(topics[cur].gen));render();setTimeout(()=>scrollTo(0,document.body.scrollHeight),0)}function makeFinal(){let pool=[];topics.slice(0,8).forEach(t=>pool=pool.concat(t.qs));pool=pool.sort(()=>Math.random()-.5).slice(0,12);finalBank=pool.concat([gen('charge'),gen('charge'),gen('coul'),gen('coul'),gen('field'),gen('field'),gen('work'),gen('work')]).sort(()=>Math.random()-.5)}
function exportData(){dataBoxEl.value=JSON.stringify(st,null,2)}function importData(){try{let x=JSON.parse(dataBoxEl.value);st=Object.assign(fresh(),x);save();render()}catch(e){alert('Import failed: invalid JSON')}}function resetData(){if(confirm('Erase all saved progress, notes, answers, and mastery data?')){st=fresh();finalBank=[];save();render()}}
const menuEl=document.getElementById('menu'),searchEl=document.getElementById('search'),dataBoxEl=document.getElementById('dataBox'),pbar=document.getElementById('pbar'),ptext=document.getElementById('ptext'),ref=document.getElementById('ref'),app=document.getElementById('app');searchEl.oninput=menu;reference();render();
</script></body></html>
