const k=9.0e9,ee=1.60e-19,KEY='nys_regents_electrostatics_v3';
let cur=-1,finalBank=[];
const $=id=>document.getElementById(id);
const fmt=x=>{let a=Math.abs(x);return a&& (a<.01||a>=10000)?x.toExponential(2).replace('e',' × 10^'):Number(x.toPrecision(3))};
const val=x=>{x=String(x).replace(/×\s*10\^/i,'e').replace(/x\s*10\^/i,'e').replace(/,/g,'');let m=x.match(/-?\d*\.?\d+(e[-+]?\d+)?/i);return m?+m[0]:NaN};

function cq(text,keys,hint,exp,tag){return nq(text,{keys},hint,exp,'',tag)}
const topics=[
{
id:'u0',title:'Unit 0: Regents Electrostatics Survival Skills',tag:'skills',
focus:'Build the habits that turn electrostatics from random formulas into a predictable Regents routine.',
why:'Electrostatics questions often look intimidating because the numbers are tiny, like 10^-6 C or 10^-19 C. The physics is usually simple: identify what is interacting, choose the one reference-table relationship that connects the givens to the unknown, and write a clear calculation. This unit trains that routine before the content gets harder.',
sections:[
['The Regents calculation script','A strong calculation answer is not just a number. Write the equation first, substitute with units, then give a final answer with units. This lets a grader see your physics even if your arithmetic is imperfect. Example: Fe=qE; Fe=(2.0×10^-6 C)(300 N/C); Fe=6.0×10^-4 N.'],
['How to read givens','The units tell you the topic. Coulombs (C) mean charge, newtons (N) mean force, volts (V) mean potential difference, joules (J) mean energy/work, and N/C means electric field. If you see two charges and a distance, think Coulomb’s law. If you see charge and field, think Fe=qE. If you see charge and voltage, think W=qV.'],
['Scientific notation without panic','Regents electrostatics uses tiny charges, so scientific notation is normal. 3.0 μC is 3.0×10^-6 C. A calculator display of 4.5E-7 means 4.5×10^-7. Powers of ten are part of the answer, not decoration.'],
['Metric prefixes','Before substituting, convert prefixes: milli=10^-3, micro=10^-6, nano=10^-9, pico=10^-12. Coulomb’s law also requires distance in meters, so centimeters must become meters.'],
['Rearranging formulas','Do algebra before substituting. From Fe=qE, if E is unknown, write E=Fe/q. From W=qV, if V is unknown, write V=W/q. This keeps your work organized and matches Regents scoring.']
],
mini:'Take any calculation question and cover the answer choices. Underline quantities with units, write Givens and Unknown, choose the formula, then solve. This turns multiple choice into a constructed response and prevents formula guessing.',
must:['Units are clues: C, N, V, J, N/C.','Convert μC, nC, pC, and cm before substituting.','Use equation → substitution with units → answer with unit.','Pick formulas from givens, not from memory panic.'],
form:['q=ne','Fe=kq1q2/r²','Fe=qE','W=qV','k=9.0×10^9 N·m²/C²','e=1.60×10^-19 C'],
traps:['Using microcoulombs as coulombs.','Writing only a final number with no unit.','Rounding after the first step instead of at the end.','Ignoring that a formula may need rearranging.'],
worked:'A charge of 2.0 μC is placed in a 300 N/C electric field. Find Fe. Convert first: 2.0 μC=2.0×10^-6 C. Equation: Fe=qE. Substitution: Fe=(2.0×10^-6 C)(300 N/C). Final answer: Fe=6.0×10^-4 N.',
qs:[
cq('Which metric prefix means 10^-6?',['micro'],'It is written μ.','Micro means 10^-6, so 1 μC=1×10^-6 C.','skills'),
nq('Convert 7.5 μC to coulombs.',7.5e-6,'Multiply by 10^-6.','7.5 μC=7.5×10^-6 C.','C','skills'),
nq('Convert 42 nC to coulombs.',4.2e-8,'Nano means 10^-9.','42 nC=42×10^-9 C=4.2×10^-8 C.','C','skills'),
nq('Convert 3.0 cm to meters.',.030,'Centi means 10^-2.','3.0 cm=3.0×10^-2 m=0.030 m.','m','skills'),
cq('A problem gives charge and electric field and asks for force. Which formula should you use?',['fe qe|f qe|force charge field'],'Look for q and E.','Use Fe=qE because it directly connects force, charge, and electric field.','skills'),
cq('A problem gives two charges and distance. Which formula should you use?',['coulomb|kq|r squared'],'Two charges plus distance is the inverse-square electrostatic force law.','Use Coulomb’s law, Fe=kq1q2/r².','skills'),
cq('Name the three calculation parts that usually earn Regents work credit.',['equation|formula','substitution','unit|answer'],'Think like a scorer.','Show the equation, substitution with units, and final answer with units.','skills'),
nq('A calculator shows 6.2E-4. Enter the value.',6.2e-4,'E-4 means ×10^-4.','6.2E-4=6.2×10^-4=0.00062.','','skills'),
cq('Which unit belongs to electric field strength?',['n/c|newton per coulomb'],'Field is force per charge.','E=Fe/q, so electric field units are N/C.','skills'),
cq('Why is unit checking useful after a calculation?',['wrong formula|mistake|check'],'Units diagnose formula choice.','If your answer asks for force but your units are J or V, you probably chose the wrong relationship.','skills')]
},
{
id:'u1',title:'Unit 1: Electric Charge Basics',tag:'charge',
focus:'Understand what charge is, why objects attract or repel, and why charge comes in packets.',
why:'Charge is the source of electrostatic interactions. Before using formulas, you need a mental picture: matter contains positive and negative charges, objects become charged by electron transfer, and electric forces can act even when objects are not touching.',
sections:[
['What charge means','Protons carry positive charge, electrons carry negative charge, and neutrons are neutral. A neutral object still contains many charges; it simply has equal total positive and negative charge.'],
['How an object becomes positive or negative','In ordinary solids, electrons are the mobile charges. If an object loses electrons, it has more positive charge than negative charge and becomes positive. If it gains electrons, it becomes negative.'],
['Forces between charges','Like charges repel and opposite charges attract. This is a force interaction, not a statement that charges “want” anything. Each object pushes or pulls on the other with equal magnitude in opposite directions.'],
['Charged objects and neutral objects','A charged object can attract a neutral object because charges inside the neutral object shift slightly. The side closer to the charged object becomes oppositely influenced, so attraction can occur even though the total object is neutral. This is polarization.'],
['Conservation and quantization','Charge is conserved: total charge does not appear from nowhere. Charge is quantized: net charge is a whole-number multiple of e=1.60×10^-19 C, because electrons and protons have fixed charge magnitudes.']
],
mini:'Rub a balloon on hair and bring it near tiny paper bits. The paper is neutral overall, but the charged balloon polarizes it. Attraction to neutral objects is one of the most common Regents conceptual ideas.',
must:['Positive objects have an electron deficit; negative objects have excess electrons.','Like charges repel; opposite charges attract.','Neutral objects can be attracted by charged objects through polarization.','Charge is conserved and quantized.'],
form:['q=ne','n=q/e','e=1.60×10^-19 C'],
traps:['Neutral does not mean no charges.','Attraction does not prove both objects are charged.','You cannot transfer 2.3 electrons; electron count must be whole.','Conservation means charge is transferred, not created.'],
worked:'How many electrons correspond to a charge magnitude of 4.80×10^-18 C? Equation: n=q/e. Substitution: n=(4.80×10^-18 C)/(1.60×10^-19 C). Final answer: n=30 electrons.',
qs:[
cq('Two negative objects are brought near each other. What happens?',['repel'],'Like charges do this.','Like charges repel, so the objects push apart.','charge'),
cq('A positive and a negative object are brought near each other. What happens?',['attract'],'Opposite charges do this.','Opposite charges attract.','charge'),
cq('A neutral object has what relationship between total positive and negative charge?',['equal|same|balanced'],'Neutral means balanced, not empty.','A neutral object has equal total positive and negative charge.','charge'),
cq('If an object loses electrons, what sign is its net charge?',['positive'],'Electrons are negative.','Removing negative charge leaves a net positive charge.','charge'),
cq('If an object gains electrons, what sign is its net charge?',['negative'],'It gains negative particles.','An object that gains electrons becomes negative.','charge'),
cq('Can a charged object attract a neutral object? Answer and name the effect.',['yes','polarization'],'Charges shift inside the neutral object.','Yes. Polarization can make a charged object attract a neutral object.','charge'),
cq('What principle says total charge is not created or destroyed?',['conservation'],'It is a conservation law.','Conservation of charge says total charge remains constant in an isolated system.','charge'),
nq('How many elementary charges are in 3.20×10^-18 C?',20,'Use n=q/e.','n=(3.20×10^-18 C)/(1.60×10^-19 C)=20 elementary charges.','charges','charge'),
nq('What is the charge magnitude of 6 electrons?',9.6e-19,'Use q=ne.','q=ne=(6)(1.60×10^-19 C)=9.60×10^-19 C.','C','charge'),
cq('Why is charge described as quantized?',['whole|integer|multiple'],'Think of whole electrons.','Net charge occurs in whole-number multiples of the elementary charge.','charge')],gen:'charge'
},
{
id:'u2',title:'Unit 2: Conductors, Insulators, and Charging',tag:'charging',
focus:'Explain how charges move, how objects become charged, and why grounding matters.',
why:'Regents electrostatics is full of demonstrations: rods, fur, balloons, metal spheres, electroscopes, and grounding. The key is always electron motion. If you can track electrons, you can explain the sign of the final charge.',
sections:[
['Conductors versus insulators','Conductors allow electrons to move throughout the material. Metals are common conductors. Insulators hold electrons more tightly, so excess charge tends to remain localized. Both can be charged, but charge redistributes much more freely in conductors.'],
['Why electrons move, not protons','In solids, protons are locked in atomic nuclei. Electrons, especially in metals, are much more mobile. Regents questions usually expect electron transfer or electron redistribution, not proton movement.'],
['Charging by friction','Rubbing two materials can transfer electrons. One object gains electrons and becomes negative; the other loses electrons and becomes positive. The total charge is conserved.'],
['Charging by contact/conduction','When a charged object touches a conductor, electrons can flow between them. After contact, identical conducting spheres share total charge equally. Contact usually leaves both objects with the same sign.'],
['Charging by induction and grounding','Induction charges without direct contact by using a nearby charged object to polarize a conductor. Grounding allows electrons to enter or leave. The order matters: polarize, ground, remove ground, then remove the charged object.']
],
mini:'Draw a neutral metal sphere as plus signs fixed in place and mobile minus signs. Move a negative rod nearby. Electrons in the sphere shift away, leaving the near side relatively positive. That picture explains attraction, induction, and grounding.',
must:['Conductors have mobile electrons; insulators do not.','Friction and contact involve electron transfer.','Induction can charge without touching the charged rod.','Grounding connects an object to Earth as a charge reservoir.'],
form:['No new calculation formula; use conservation of charge.','Identical conductors share total charge equally after contact.'],
traps:['Saying protons travel through a metal object.','Confusing temporary polarization with a permanent net charge.','Forgetting that contact charging requires touching.','Removing the charged rod before removing ground during induction.'],
worked:'A negative rod touches a neutral metal sphere. Electrons move from the rod onto the sphere. The sphere now has excess electrons, so it is negative. This is charging by contact/conduction.',
qs:[
cq('Which allows electrons to move freely: conductor or insulator?',['conductor'],'Metals are examples.','A conductor allows electrons to move freely through it.','charging'),
cq('In solids, which charged particles usually move during charging?',['electrons'],'Protons are in nuclei.','Electrons are the mobile charged particles in ordinary solid charging.','charging'),
cq('Rubbing a balloon on hair is charging by what method?',['friction'],'Rubbing is the clue.','Charging by friction transfers electrons by rubbing.','charging'),
cq('Touching a charged rod to a neutral sphere is charging by what method?',['contact|conduction'],'Touching is the clue.','Charging by contact, also called conduction, transfers charge by touching.','charging'),
cq('Charging a conductor without touching it with the charged rod is called what?',['induction'],'Usually uses grounding.','Induction can leave a conductor charged without direct contact with the charged rod.','charging'),
cq('What does grounding provide for electrons?',['path|earth|reservoir'],'Earth is huge compared with the object.','Grounding provides a path for electrons to flow to or from Earth.','charging'),
cq('After a negative rod contacts a neutral metal sphere, what sign is the sphere usually?',['negative'],'Electrons moved onto it.','The sphere gains electrons and becomes negative.','charging'),
cq('Charge separation in a neutral object caused by a nearby charged object is called what?',['polarization'],'No net charge is required.','That charge separation is polarization.','charging'),
nq('Identical metal spheres with charges +6 C and 0 C touch and separate. What charge is on each?',3,'Add and divide by two.','Total charge is +6 C. Identical spheres share equally, so each has +3 C.','C','charging'),
cq('Why does an insulator hold localized charge better than a conductor?',['not free|tightly|do not move'],'Charges cannot spread easily.','Electrons in an insulator are not free to move throughout the material, so charge stays localized.','charging')]
},
{
id:'u3',title:'Unit 3: Coulomb’s Law',tag:'coulomb',
focus:'Calculate electric force and understand inverse-square reasoning.',
why:'Coulomb’s law is the big force law of electrostatics. It tells you how strongly two charges interact and why distance matters so much. Regents problems use it for calculations and for proportional reasoning.',
sections:[
['What the law says','Coulomb’s law is Fe=kq1q2/r². It gives the magnitude of the electrostatic force between two charges or charged spheres. Charges must be in coulombs and distance must be in meters.'],
['Distance between centers','For spheres, r is the distance between centers, not the empty gap between surfaces. This matters because the formula treats the charge as if it acts from the center for Regents-style spherical objects.'],
['Direct charge relationship','Force is directly proportional to each charge. If q1 doubles, force doubles. If both q1 and q2 double, force becomes four times as large.'],
['Inverse-square distance relationship','Force is inversely proportional to r². Doubling distance gives one-fourth the force. Tripling distance gives one-ninth the force. Cutting distance in half makes force four times larger.'],
['Magnitude and direction are separate','Use the formula for magnitude. Then use signs for direction: same signs repel, opposite signs attract. Do not report a negative magnitude; describe attraction or repulsion separately.']
],
mini:'Make a tiny table: r, 2r, 3r, r/2. Under force write F, F/4, F/9, 4F. This table solves most Regents distance-change questions without arithmetic.',
must:['k=9.0×10^9 N·m²/C².','Use charge in C and distance in m.','Force is directly proportional to q1 and q2.','Force is inversely proportional to r².'],
form:['Fe=kq1q2/r²'],
traps:['Forgetting to square r.','Using centimeters or microcoulombs directly.','Using surface-to-surface distance for spheres.','Mixing up attraction/repulsion with the magnitude calculation.'],
worked:'q1=2.0×10^-6 C, q2=3.0×10^-6 C, r=0.50 m. Equation: Fe=kq1q2/r². Substitution: Fe=(9.0×10^9)(2.0×10^-6 C)(3.0×10^-6 C)/(0.50 m)². Final answer: Fe=0.216 N. If the signs are opposite, the force is attractive.',
qs:[
cq('Two positive charges exert what kind of force on each other?',['repel'],'Like charges.','Like charges repel.','coulomb'),
cq('A positive and a negative charge exert what kind of force on each other?',['attract'],'Opposite charges.','Opposite charges attract.','coulomb'),
cq('For two charged spheres, r in Coulomb’s law is measured between what points?',['center|centers'],'Not the surface gap.','Use the distance between centers.','coulomb'),
nq('If distance doubles and charges stay the same, force becomes what fraction?',.25,'Use 1/r².','Fe∝1/r², so doubling r gives 1/2²=1/4.','fraction','coulomb'),
nq('If distance triples and charges stay the same, force becomes what fraction?',1/9,'Use 1/r².','Fe∝1/r², so tripling r gives 1/3²=1/9.','fraction','coulomb'),
nq('If q1 triples and everything else stays the same, force changes by what factor?',3,'Directly proportional to q1.','Fe is directly proportional to q1, so the force triples.','factor','coulomb'),
nq('If both charges double and r is unchanged, force changes by what factor?',4,'Multiply the charge factors.','Fe∝q1q2, so 2×2=4 times larger.','factor','coulomb'),
nq('Find Fe for q1=1.0×10^-6 C, q2=2.0×10^-6 C, r=0.30 m.',.2,'Use Fe=kq1q2/r².','Fe=(9.0×10^9)(1.0×10^-6 C)(2.0×10^-6 C)/(0.30 m)²=0.20 N.','N','coulomb'),
cq('Does Coulomb’s law calculation give magnitude, direction, or both?',['magnitude'],'Signs decide direction separately.','The formula gives magnitude; attraction or repulsion describes direction.','coulomb'),
cq('Compared with gravity, electric force can attract and also what?',['repel'],'Gravity only attracts in Regents physics.','Electric force can attract or repel, while gravity only attracts.','coulomb')],gen:'coul'
},
{
id:'u4',title:'Unit 4: Electric Fields',tag:'field',
focus:'Use electric field as force per charge and interpret field-line diagrams.',
why:'Electric field is the bridge from individual charges to regions of space. Instead of asking only “what force between two charges,” a field asks “what would happen to a charge placed here?” That idea makes plate problems and diagrams much easier.',
sections:[
['Field as a property of space','A charge creates an electric field around it. Another charge placed in that region experiences a force. The field exists even before the test charge is placed there.'],
['Force per charge','Electric field strength is force per unit charge: E=Fe/q. The unit N/C literally means newtons of force for each coulomb of charge.'],
['Positive test charge direction','By definition, electric field direction is the direction of the force on a positive test charge. A negative charge feels force opposite the field direction.'],
['Field-line diagrams','Field lines point away from positive source charges and toward negative source charges. Closer spacing means stronger field. Lines do not cross because a point cannot have two field directions.'],
['Using Fe=qE','If you know the field at a point and the charge placed there, the force is Fe=qE. The same field can produce different forces on different charges because force depends on q.']
],
mini:'Imagine placing a tiny positive test charge at different points in a diagram. Draw the direction it would be pushed. Those arrows are the electric field directions.',
must:['E=Fe/q and Fe=qE.','Electric field direction follows a positive test charge.','Negative charges feel force opposite E.','Closer field lines mean stronger field.'],
form:['Fe=qE','E=Fe/q','q=Fe/E','E units: N/C'],
traps:['Confusing field direction with electron force direction.','Thinking field requires a test charge to exist.','Forgetting field-line spacing represents strength.','Saying field lines cross.'],
worked:'A 3.0×10^-6 C charge experiences a 0.012 N force. Equation: E=Fe/q. Substitution: E=(0.012 N)/(3.0×10^-6 C). Final answer: E=4.0×10^3 N/C.',
qs:[
cq('Electric field direction is defined by force on what sign of test charge?',['positive'],'This is the definition.','Electric field points in the direction a positive test charge would be forced.','field'),
cq('Field lines around a positive source charge point inward or outward?',['outward|away'],'They leave positive charges.','Field lines point away from positive charges.','field'),
cq('Field lines around a negative source charge point inward or outward?',['inward|toward'],'They enter negative charges.','Field lines point toward negative charges.','field'),
cq('Where field lines are closer together, the field is stronger or weaker?',['stronger'],'Line density indicates field strength.','Closer field lines represent a stronger electric field.','field'),
nq('A 2.0×10^-6 C charge in a 500 N/C field feels what force?',1e-3,'Use Fe=qE.','Fe=qE=(2.0×10^-6 C)(500 N/C)=1.0×10^-3 N.','N','field'),
nq('A 0.020 N force acts on a 4.0×10^-6 C charge. Find E.',5000,'Use E=Fe/q.','E=Fe/q=(0.020 N)/(4.0×10^-6 C)=5.0×10^3 N/C.','N/C','field'),
cq('A negative charge in a rightward electric field feels force in what direction?',['left'],'Negative is opposite.','A negative charge feels force opposite the field, so left.','field'),
cq('Can an electric field exist at a point even if no test charge is there?',['yes'],'The test charge detects the field.','Yes. The field is a property of the space around source charges.','field'),
nq('A charge feels 0.60 N in a 200 N/C field. Find q.',.003,'Use q=Fe/E.','q=Fe/E=(0.60 N)/(200 N/C)=3.0×10^-3 C.','C','field'),
cq('Do electric field lines cross in Regents diagrams?',['no'],'A point cannot have two field directions.','No. Field lines do not cross because the field has one direction at each point.','field')],gen:'field'
},
{
id:'u5',title:'Unit 5: Uniform Electric Fields and Parallel Plates',tag:'plates',
focus:'Apply electric field ideas between oppositely charged parallel plates.',
why:'Parallel plates are the cleanest Regents example of a uniform electric field. Once you know the field direction and charge sign, you can predict the force and motion of particles in the field.',
sections:[
['What uniform means','Between ideal oppositely charged parallel plates, the electric field is nearly constant in magnitude and direction. Regents problems usually ignore edge effects.'],
['Direction between plates','Field lines go from the positive plate to the negative plate. In diagrams, they are straight, parallel, and evenly spaced.'],
['Forces on positive and negative particles','A positive charge feels force in the field direction. A negative charge feels force opposite the field direction. This is why electrons accelerate toward the positive plate.'],
['Same field, different forces','The field strength is the same at different points between ideal plates, but the force on a particle still depends on its charge: Fe=qE. Larger charge magnitude means larger force.'],
['Qualitative motion','If released from rest, a charged particle accelerates in the direction of the net electric force. Regents does not require calculus; describe direction and relative force.']
],
mini:'Draw a + plate on the left and a - plate on the right. Put a proton and an electron in the middle. The field points right. The proton force is right; the electron force is left.',
must:['Uniform field means same E throughout the ideal region.','Field direction is positive plate to negative plate.','Positive charge force is with E; negative charge force is opposite E.','Use Fe=qE for force in the field.'],
form:['Fe=qE','E=Fe/q'],
traps:['Thinking the field is stronger just because a point is closer to one ideal plate.','Forgetting electrons move opposite field direction.','Using AP capacitor formulas not needed for Regents.','Confusing electric field direction with current direction.'],
worked:'The electric field between plates points right. A proton feels force right. An electron feels force left. If q=4.0×10^-6 C and E=200 N/C, Fe=qE=(4.0×10^-6 C)(200 N/C)=8.0×10^-4 N.',
qs:[
cq('Between parallel plates, electric field points from which plate to which plate?',['positive','negative'],'Field lines leave + and enter -.','The electric field points from the positive plate toward the negative plate.','plates'),
cq('A proton between plates feels force in the same direction as E or opposite E?',['same'],'A proton is positive.','A positive charge feels force in the direction of the electric field.','plates'),
cq('An electron between plates feels force in the same direction as E or opposite E?',['opposite'],'An electron is negative.','A negative charge feels force opposite the field.','plates'),
cq('At two points between ideal parallel plates, field strength is the same or different?',['same|uniform'],'Uniform field.','The field strength is the same throughout the ideal region.','plates'),
nq('A +5.0×10^-6 C charge is in a 300 N/C uniform field. Find Fe.',1.5e-3,'Use Fe=qE.','Fe=qE=(5.0×10^-6 C)(300 N/C)=1.5×10^-3 N.','N','plates'),
cq('If the top plate is positive and the bottom plate is negative, what direction is E?',['down|downward'],'From + to -.','The field points downward from the positive top plate to the negative bottom plate.','plates'),

function fresh(){return{done:{},notes:{},answers:{},stat:{},miss:{}}}
let st=JSON.parse(localStorage.getItem(KEY)||'null')||fresh();
function save(){localStorage.setItem(KEY,JSON.stringify(st));progress()}
function stat(id){return st.stat[id]||(st.stat[id]={c:0,a:0})}
function progress(){let d=topics.filter(t=>st.done[t.id]).length,p=Math.round(d/topics.length*100),tot={c:0,a:0};topics.forEach(t=>{let s=stat(t.id);tot.c+=s.c;tot.a+=s.a});$('pbar').style.width=p+'%';$('ptext').textContent=p+'% lessons complete | '+tot.c+'/'+tot.a+' questions correct'}
function reference(){$('ref').innerHTML='<ul class="small"><li>q=ne; e=1.60×10^-19 C</li><li>Fe=kq1q2/r²; k=9.0×10^9 N·m²/C²</li><li>Fe=qE; E in N/C</li><li>W=qV; 1 V=1 J/C</li><li>1 eV=1.60×10^-19 J</li><li>m=10^-3, μ=10^-6, n=10^-9, p=10^-12</li></ul>'}
function menu(){let s=clean($('search').value),html='<b>Course Menu</b><span class="link '+(cur<0?'sel':'')+'" onclick="cur=-1;render()">Dashboard</span>';topics.forEach((t,i)=>{let hay=clean(t.title+' '+t.focus+' '+t.why+' '+t.must.join(' '));if(!s||hay.includes(s))html+='<span class="link '+(cur==i?'sel':'')+'" onclick="cur='+i+';render()">'+t.title+(st.done[t.id]?' <span class=done>✓</span>':'')+'</span>'});$('menu').innerHTML=html}
function dashboard(){progress();menu();let rows=topics.map(t=>{let s=stat(t.id),m=s.a?Math.round(100*s.c/s.a):0;return '<tr class="'+(s.a&&m<70?'weak':'')+'"><td>'+t.title+'</td><td>'+(st.done[t.id]?'yes':'no')+'</td><td>'+m+'%</td><td>'+s.c+'/'+s.a+'</td></tr>'}).join('');let weak=topics.filter(t=>{let s=stat(t.id);return s.a&&s.c/s.a<.7}).map(t=>'<span class=pill>'+t.title+'</span>').join(' ')||'None yet. Answer practice questions to diagnose.';let miss=Object.entries(st.miss||{}).sort((a,b)=>b[1]-a[1]).map(x=>'<span class=pill>'+x[0]+': '+x[1]+'</span>').join(' ')||'No missed skill tags yet.';$('app').innerHTML='<h2>Dashboard</h2><div class=grid><div class=box><b>Overall</b><p>'+$('ptext').textContent+'</p></div><div class="box red"><b>Weak lessons</b><p>'+weak+'</p></div><div class=box><b>Most missed skills</b><p>'+miss+'</p></div></div><div class="box yellow"><b>How this course is meant to work</b><ol><li>Read the full lesson section, not just the formula card.</li><li>Explain the big idea aloud in your own words.</li><li>Redo the worked example on paper.</li><li>Answer practice questions and read every explanation, especially when correct by guessing.</li><li>Use the weak-topic list to review, then retake random questions.</li></ol></div><h3>Mastery by topic</h3><table><tr><th>Topic</th><th>Complete</th><th>Mastery</th><th>Correct/Attempted</th></tr>'+rows+'</table>'}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){if(cur<0)return dashboard();let t=topics[cur];if(t.final&&!finalBank.length)makeFinal();progress();menu();let s=stat(t.id),qs=t.final?finalBank:t.qs;$('app').innerHTML='<h2>'+t.title+'</h2><p><b>Focus:</b> '+t.focus+'</p><div class=nav><button onclick="cur=Math.max(0,cur-1);render()">Previous</button><button onclick="cur=Math.min(topics.length-1,cur+1);render()">Next</button><button onclick="st.done[\''+t.id+'\']=1;save();render()">Mark Complete</button>'+(t.gen?'<button onclick="addRandom()">New Random Question</button>':'')+(t.final?'<button onclick="makeFinal();render()">New 20-question quiz</button>':'')+'</div><div class="box blue call"><h3>Why this matters</h3><p>'+t.why+'</p></div><div class="box lesson"><h3>Actual Lesson</h3>'+t.sections.map(a=>'<h4>'+a[0]+'</h4><p>'+a[1]+'</p>').join('')+'</div><div class="box yellow"><h3>Mini Investigation / Mental Picture</h3><p>'+t.mini+'</p></div><div class=grid><div class=box><h3>Must-know facts</h3><ul class=checklist>'+t.must.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class=box><h3>Formula card</h3><ul>'+t.form.map(x=>'<li class=mono>'+x+'</li>').join('')+'</ul></div><div class="box red"><h3>Common Regents traps</h3><ul>'+t.traps.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div><div class="box yellow"><h3>Worked Regents Example</h3><p>'+t.worked+'</p></div><h3>Practice and Quiz</h3><p class=small>Numerical answers accept about 2% tolerance. Explanations model equation, substitution, final answer, and units.</p><div id=qs>'+qs.map((x,i)=>qhtml(x,i,t.id)).join('')+'</div><div class=box><b>Autosaved Notes</b><textarea oninput="st.notes[\''+t.id+'\']=this.value;save()">'+esc(st.notes[t.id]||'')+'</textarea></div><p class=small>Topic mastery: '+(s.a?Math.round(100*s.c/s.a):0)+'% ('+s.c+'/'+s.a+')</p>'}
function qhtml(x,i,id){let key=id+'_'+i,v=esc(st.answers[key]||'');return '<div class=q><b>Q'+(i+1)+'.</b> '+x.text+'<br><input class=ans id=a'+i+' value="'+v.replace(/"/g,'&quot;')+'" oninput="st.answers[\''+key+'\']=this.value;save()" placeholder="type answer"><br><button onclick="check('+i+')">Check Answer</button><button onclick="hint('+i+')">Show Hint</button><div id=r'+i+'></div></div>'}
function curQs(){return topics[cur].final?finalBank:topics[cur].qs}
function check(i){let x=curQs()[i],v=$('a'+i).value,ok=false;if(typeof x.ans=='number'){let n=val(v);ok=isFinite(n)&&Math.abs(n-x.ans)<=Math.max(Math.abs(x.ans)*.02,1e-12)}else{let c=clean(v);ok=x.ans.keys.every(g=>String(g).split('|').some(w=>c.includes(clean(w))))}let s=stat(topics[cur].id);s.a++;if(ok)s.c++;else st.miss[x.tag||topics[cur].tag]=(st.miss[x.tag||topics[cur].tag]||0)+1;save();$('r'+i).innerHTML='<p class="'+(ok?'ok':'bad')+'">'+(ok?'Correct':'Not yet')+'</p><p><b>Full explanation:</b> '+x.exp+(x.unit?' <b>Correct unit:</b> '+x.unit+'.':'')+'</p>'}
function hint(i){$('r'+i).innerHTML='<p><b>Hint:</b> '+curQs()[i].hint+'</p>'}
function R(a,b){return +(a+Math.random()*(b-a)).toPrecision(2)}
function gen(type){if(type=='charge'){let n=Math.floor(R(8,90)),ch=n*ee;return nq('Random: A charge has magnitude '+fmt(ch)+' C. How many elementary charges were transferred?',n,'Use n=q/e.','Equation: n=q/e. Substitution: n=('+fmt(ch)+' C)/(1.60×10^-19 C). Final answer: '+n+' elementary charges.','charges','charge')}if(type=='coul'){let q1=R(1,9)*1e-6,q2=R(1,9)*1e-6,r=R(.20,.95),ans=k*q1*q2/(r*r);return nq('Random: q1='+fmt(q1)+' C, q2='+fmt(q2)+' C, r='+r+' m. Find electrostatic force magnitude.',ans,'Use Fe=kq1q2/r² with r in meters.','Equation: Fe=kq1q2/r². Substitution: Fe=(9.0×10^9)('+fmt(q1)+' C)('+fmt(q2)+' C)/('+r+' m)². Final answer: Fe='+fmt(ans)+' N.','N','coulomb')}if(type=='field'){let ch=R(1,9)*1e-6,ef=R(120,950),ans=ch*ef;return nq('Random: A '+fmt(ch)+' C charge is in a '+ef+' N/C field. Find Fe.',ans,'Use Fe=qE.','Equation: Fe=qE. Substitution: Fe=('+fmt(ch)+' C)('+ef+' N/C). Final answer: Fe='+fmt(ans)+' N.','N','field')}let ch=R(.2,5),v=R(3,30),ans=ch*v;return nq('Random: A '+ch+' C charge moves through '+v+' V. Find W.',ans,'Use W=qV.','Equation: W=qV. Substitution: W=('+ch+' C)('+v+' V). Final answer: W='+fmt(ans)+' J.','J','voltage')}
function addRandom(){topics[cur].qs.push(gen(topics[cur].gen));render();setTimeout(()=>scrollTo(0,document.body.scrollHeight),0)}
function makeFinal(){let pool=[];topics.slice(0,8).forEach(t=>pool=pool.concat(t.qs));pool=pool.sort(()=>Math.random()-.5).slice(0,12);finalBank=pool.concat([gen('charge'),gen('charge'),gen('coul'),gen('coul'),gen('field'),gen('field'),gen('work'),gen('work')]).sort(()=>Math.random()-.5)}
function exportData(){$('dataBox').value=JSON.stringify(st,null,2)}
function importData(){try{st=Object.assign(fresh(),JSON.parse($('dataBox').value));save();render()}catch(e){alert('Import failed: invalid JSON')}}
function resetData(){if(confirm('Erase all saved progress, notes, answers, and mastery data?')){st=fresh();finalBank=[];save();render()}}
$('search').oninput=menu;reference();render();
</script>
