<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NY Regents Physics: Electrostatics</title><style>
body{font:14px Arial,Helvetica,sans-serif;margin:0;background:white;color:#111}a{color:#0645ad;cursor:pointer}#top{border-bottom:1px solid #aaa;background:#eef;padding:6px 10px;position:sticky;top:0;z-index:2}#bar{height:14px;border:1px solid #777;background:white;display:inline-block;width:180px;vertical-align:middle}#fill{height:100%;background:#69c;width:0}.wrap{display:flex}.side{width:245px;border-right:1px solid #aaa;padding:8px;background:#f8f8ff;min-height:calc(100vh - 34px)}.main{flex:1;padding:12px;max-width:960px}.nav a{display:block;padding:4px;border-bottom:1px solid #ddd;text-decoration:none}.nav a.on{background:#dbe8ff;font-weight:bold}.box,.q,.card{border:1px solid #aaa;background:#fff;padding:8px;margin:8px 0}.card{background:#ffffee}.small{font-size:12px;color:#444}h1{font-size:24px;border-bottom:1px solid #aaa}h2{font-size:18px;margin-top:16px}button,input,textarea,select{font:14px Arial;margin:3px}textarea{width:98%;height:80px}.ok{color:green;font-weight:bold}.bad{color:#b00000;font-weight:bold}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:3px 6px}.formula{position:sticky;top:40px;background:#f5f5f5}.ans{max-width:230px}.hide{display:none}@media(max-width:700px){.wrap{display:block}.side{width:auto;min-height:0;border-right:0;border-bottom:1px solid #aaa}.formula{position:static}.main{padding:8px}}@media print{.side,#top,button,input,textarea{display:none}.main{max-width:none}.q,.box,.card{break-inside:avoid}}
</style></head><body><div id="top"><b>Regents Electrostatics Course</b> <span id="pct"></span> <span id="bar"><span id="fill"></span></span> <button onclick="dash()">Dashboard</button> <button onclick="exp()">Export JSON</button> <input type="file" id="imp" onchange="imp(event)"> <button onclick="resetAll()">Reset Progress</button></div><div class="wrap"><aside class="side"><input id="search" placeholder="Search topics" oninput="nav()" style="width:95%"><div class="box formula"><b>Formula Reference</b><table><tr><td>Charge quantum</td><td>q=ne, e=1.60×10^-19 C</td></tr><tr><td>Coulomb</td><td>F<sub>e</sub>=kq<sub>1</sub>q<sub>2</sub>/r²</td></tr><tr><td>Constant</td><td>k=9.0×10^9 N·m²/C²</td></tr><tr><td>Field</td><td>F<sub>e</sub>=qE, E=F/q</td></tr><tr><td>Voltage/work</td><td>W=qV, V=W/q</td></tr><tr><td>Energy</td><td>1 eV=1.60×10^-19 J</td></tr></table></div><div id="nav" class="nav"></div></aside><main id="main" class="main"></main></div><script>
const K=9e9,E=1.6e-19,LS='regents_e_static_v1',fmt=x=>{if(!isFinite(x))return'';let a=Math.abs(x);return(a&& (a<.01||a>=1e4))?x.toExponential(2).replace('e','×10^'):Number(x.toPrecision(3))},rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choice=a=>a[rnd(0,a.length-1)];
let st=JSON.parse(localStorage[LS]||'{}');st.done=st.done||{};st.notes=st.notes||{};st.stats=st.stats||{};st.ans=st.ans||{};let cur=0,qs=[];
const common={survive:['Use the reference table first: identify variables, copy equation, substitute with units, then solve. Scientific notation and units earn Regents credit.','Prefixes: m=10^-3, µ=10^-6, n=10^-9, p=10^-12. C, N, V, J, N/C must match the formula. Rearrange before substituting when possible.','Do not drop exponents; do not use cm where m is required; include equation, substitution, final answer with unit.','Equation: W=qV. Substitution: W=(2.0 C)(6.0 V). Answer: W=12 J. Since 1 V=1 J/C, units become joules.'],charge:['Matter contains positive protons, negative electrons, and neutral neutrons. Net charge depends on excess or missing electrons.','Like charges repel, opposites attract, and charged objects can attract neutral objects by polarization. Charge is conserved and quantized in multiples of e.','Positive object means electrons were removed, not protons added. Charge cannot be any random value; it is n(1.60×10^-19 C).','Equation: n=q/e. Substitution: n=(3.20×10^-18 C)/(1.60×10^-19 C). Answer: n=20 elementary charges.'],charging:['Conductors let electrons move freely; insulators hold charge in place. Solids usually transfer electrons, not protons.','Friction transfers electrons, contact shares charge by touching, induction charges without touching by separation plus grounding. Grounding lets electrons enter or leave Earth.','Induction can give an object charge opposite the nearby object; neutral objects can be attracted; protons do not travel through a metal sphere.','A negative rod near a neutral metal sphere repels electrons. If grounded, electrons leave. Remove ground, then rod: sphere is positive.'],coul:['Coulomb’s law gives the magnitude of electrostatic force between point/spherical charges using center-to-center distance.','F increases with either charge and decreases with r². Same signs repel; opposite signs attract. Use meters and coulombs.','For doubling distance, force becomes 1/4. For doubling both charges, force becomes 4×. Direction is separate from magnitude.','Equation: F=kq1q2/r². Substitution: F=(9.0×10^9)(2.0×10^-6 C)(3.0×10^-6 C)/(0.30 m)². Answer: F=0.60 N, attractive if signs are opposite.'],field:['Electric field strength is force per unit positive test charge. Field direction is the force direction on a positive test charge.','F=qE, so E=F/q. Units are N/C. Lines leave + charges, enter - charges, and are closer where field is stronger.','Negative charges feel force opposite the field. Field exists even if no test charge is present.','Equation: E=F/q. Substitution: E=(0.080 N)/(2.0×10^-6 C). Answer: E=4.0×10^4 N/C.'],plates:['Between ideal oppositely charged parallel plates, the electric field is uniform and points from + plate to - plate.','A positive charge accelerates with the field; a negative charge accelerates opposite the field. Same q in same E feels same force anywhere between plates.','Do not say the field is stronger near one plate in the ideal Regents model. Force direction depends on sign of charge.','Equation: F=qE. Substitution: F=(3.0×10^-6 C)(2.0×10^4 N/C). Answer: F=0.060 N toward the negative plate for a positive charge.'],volt:['Potential difference is energy/work per charge. Use W=qV. One volt equals one joule per coulomb.','Charges gain or lose electrical energy moving through a voltage. Convert eV to J with 1 eV=1.60×10^-19 J.','Voltage is not energy by itself; it is energy per coulomb. Use joules for W, coulombs for q.','Equation: W=qV. Substitution: W=(4.0 C)(12 V). Answer: W=48 J.'],mix:['Mixed Regents problems are mostly formula selection, units, and proportional reasoning. Choose from Coulomb, field, or work/voltage.','Coulomb needs two charges and distance; field needs one charge plus E or F; voltage/work needs q and V or W.','Do not mix E and V formulas. Check if distance appears; only Coulomb uses r² in this unit.','A charge in a field: use F=qE. Two charges separated by r: use Coulomb. Charge moved through voltage: use W=qV.'],final:['This final check mixes all Regents electrostatics skills. Aim for 80%+, then review weak topics.','Show equation, substitution, and answer with unit for calculations. Concept questions require correct sign, direction, or relationship.','Most mistakes are wrong formula, wrong prefix, forgetting square on distance, and force direction for negative charges.','For a full-credit calculation: write formula, substitute with units, compute with scientific notation, box answer and unit.']};
const T=[['survive','Unit 0: Survival Skills'],['charge','Unit 1: Electric Charge Basics'],['charging','Unit 2: Conductors, Insulators, Charging'],['coul','Unit 3: Coulomb’s Law'],['field','Unit 4: Electric Fields'],['plates','Unit 5: Uniform Fields/Plates'],['volt','Unit 6: Voltage, Work, Energy'],['mix','Unit 7: Mixed Review'],['final','Unit 8: Final Mastery Check']].map((x,i)=>({id:x[0],title:x[1],txt:common[x[0]]}));
function save(){localStorage[LS]=JSON.stringify(st);topbar()}function topbar(){let d=Object.keys(st.done).length,p=Math.round(100*d/T.length),a=0,c=0;for(let k in st.stats){a+=st.stats[k].a||0;c+=st.stats[k].c||0}pct.textContent=` ${p}% complete | ${c}/${a} correct`;fill.style.width=p+'%'}
function nav(){let s=search.value.toLowerCase();nav.innerHTML=T.map((t,i)=>t.title.toLowerCase().includes(s)?`<a class="${i==cur?'on':''}" onclick="go(${i})">${st.done[t.id]?'✓ ':''}${t.title}</a>`:'').join('')}function go(i){cur=i;render()}function prev(){if(cur>0)go(cur-1)}function next(){if(cur<T.length-1)go(cur+1)}
function qConcept(text,opts,ans,hint,exp){return{kind:'mc',text,opts,ans,hint,exp}}function qNum(text,ans,unit,hint,exp){return{kind:'num',text,ans,unit,hint,exp}}function qText(text,keys,hint,exp){return{kind:'text',text,keys,hint,exp}}
function gen(id){let q=[],m=choice([1,2,3,4,5,6,8,9]);if(id=='charge'){let n=rnd(2,90),chg=n*E;q.push(qNum(`A small object has a charge of ${fmt(chg)} C. How many elementary charges is this?`,n,'charges','Use n=q/e.',`Equation: n=q/e<br>Substitution: n=(${fmt(chg)} C)/(1.60×10^-19 C)<br>Answer: ${n} elementary charges.`))}if(id=='coul'){let q1=rnd(1,9)*1e-6,q2=rnd(1,9)*1e-6,r=rnd(2,9)/10,F=K*q1*q2/(r*r);q.push(qNum(`Two charges, ${fmt(q1)} C and ${fmt(q2)} C, are ${r.toFixed(2)} m apart. Find the electrostatic force magnitude.`,F,'N','Use Fe=kq1q2/r² with r in meters.',`Equation: F<sub>e</sub>=kq<sub>1</sub>q<sub>2</sub>/r²<br>Substitution: F=(9.0×10^9)(${fmt(q1)} C)(${fmt(q2)} C)/(${r.toFixed(2)} m)²<br>Answer: ${fmt(F)} N.`))}if(id=='field'||id=='plates'){let qq=rnd(1,9)*1e-6,ee=rnd(2,9)*1e4,F=qq*ee;q.push(qNum(`A charge of ${fmt(qq)} C is in an electric field of ${fmt(ee)} N/C. Find the force magnitude.`,F,'N','Use Fe=qE.',`Equation: F<sub>e</sub>=qE<br>Substitution: F=(${fmt(qq)} C)(${fmt(ee)} N/C)<br>Answer: ${fmt(F)} N.`))}if(id=='volt'){let qq=rnd(2,9),V=rnd(3,24),W=qq*V;q.push(qNum(`How much work is done moving ${qq}.0 C of charge through a potential difference of ${V}.0 V?`,W,'J','Use W=qV.',`Equation: W=qV<br>Substitution: W=(${qq}.0 C)(${V}.0 V)<br>Answer: ${fmt(W)} J.`))}return q}
function base(id){let b={survive:[qNum('Convert 6.0 microcoulombs to coulombs.',6e-6,'C','micro means 10^-6.','6.0 µC = 6.0×10^-6 C.'),qConcept('Which line usually earns Regents calculation credit?',['Only final number','Equation, substitution with units, answer with unit','A paragraph only'],1,'Regents wants work shown.','Use equation → substitution with units → final answer with unit.'),qConcept('Which formula uses distance squared?',['W=qV','Fe=qE','Fe=kq1q2/r²'],2,'Look for r².','Coulomb’s law uses inverse-square distance.'),qText('Name two common electrostatics units.', ['c,n,v,j'], 'Examples: C, N, V, J, N/C.','Acceptable examples include coulomb (C), newton (N), volt (V), joule (J), N/C.')],charge:[qConcept('Two positive objects will',['attract','repel','have no force'],1,'Like charges repel.','Both are positive, so they repel.'),qConcept('A charged balloon can attract a neutral wall because',['polarization','gravity','magnetism'],0,'Charges shift slightly in the wall.','The neutral wall polarizes, causing attraction.'),qNum('How many elementary charges are in 4.80×10^-19 C?',3,'charges','Divide by e.','n=q/e=(4.80×10^-19 C)/(1.60×10^-19 C)=3 charges.'),qConcept('Charge is conserved means total charge is',['created','destroyed','constant in an isolated system'],2,'Conserved means total stays the same.','Charge transfers, but total charge remains constant.')],charging:[qConcept('In solid conductors, the particles that usually move are',['protons','electrons','neutrons'],1,'Protons are locked in nuclei.','Electrons are mobile; protons usually stay fixed in solids.'),qConcept('Charging by contact requires',['touching','no touching','only gravity'],0,'Contact means touch.','Conduction/contact transfers charge by touching.'),qConcept('Grounding allows charge to',['enter/leave Earth','be destroyed','turn into mass'],0,'Earth is a charge reservoir.','Grounding lets electrons flow to or from Earth.'),qText('An object charged without touching by using a nearby charged object and ground is charged by ____.', ['induction'], 'No touching = induction.','This is charging by induction.')],coul:[qConcept('If distance between two charges doubles, force becomes',['1/2','1/4','4'],1,'Inverse square.','F∝1/r², so doubling r makes F one-fourth.'),qConcept('Opposite charges exert a force that is',['repulsive','attractive','zero'],1,'Opposites attract.','Opposite signs attract.'),qConcept('Coulomb’s law distance is measured between',['surfaces','centers','the table edges'],1,'Regents uses center-to-center.','Use distance between centers of spherical/point charges.'),...gen('coul')],field:[qConcept('Electric field direction is defined as force on a',['positive test charge','negative test charge','neutron'],0,'By definition positive.','Field points in direction a positive test charge would be pushed.'),qConcept('Unit of electric field strength is',['N/C','J/C','C/N'],0,'From E=F/q.','E=F/q gives N/C.'),qConcept('Field lines near a positive charge point',['inward','outward','nowhere'],1,'Positive repels positive test charge.','Lines leave positive charges.'),...gen('field')],plates:[qConcept('Between ideal parallel plates, field direction is',['+ to -','- to +','random'],0,'Field follows positive test charge.','A positive test charge moves from + plate toward - plate.'),qConcept('A negative charge in a field feels force',['with field','opposite field','no force'],1,'Negative reverses direction.','Negative charges accelerate opposite the electric field.'),qConcept('In the ideal Regents model, field strength between plates is',['uniform','zero at center','strong only near edges'],0,'Parallel plates make uniform field.','The field is approximately the same everywhere between plates.'),...gen('plates')],volt:[qConcept('One volt equals',['1 J/C','1 C/J','1 N/C'],0,'Voltage is energy per charge.','1 V = 1 J/C.'),qNum('Convert 3.0 eV to joules.',4.8e-19,'J','Multiply by 1.60×10^-19 J/eV.','3.0 eV(1.60×10^-19 J/eV)=4.8×10^-19 J.'),qConcept('Which formula relates work, charge, and voltage?',['W=qV','F=qE','F=kq1q2/r²'],0,'Look for W and V.','Electrical work/energy is W=qV.'),...gen('volt')],mix:[qConcept('Problem gives two charges and distance. Choose',['Fe=kq1q2/r²','Fe=qE','W=qV'],0,'Distance r is a clue.','Two charges separated by r means Coulomb’s law.'),qConcept('Problem gives charge and electric field. Choose',['W=qV','Fe=qE','q=ne'],1,'Field E is a clue.','Use Fe=qE.'),qConcept('If both charges double and distance is unchanged, force becomes',['2×','4×','1/4×'],1,'F is proportional to q1q2.','Doubling both charges makes product 4 times larger.'),qText('What should a Regents calculation response show?', ['equation,substitution,unit'], 'Three parts.','Show equation, substitution with units, and final answer with unit.')],final:[]};return b[id]||[]}
function finalQs(){let ids=['survive','charge','charging','coul','field','plates','volt','mix'],a=[];ids.forEach(id=>a=a.concat(base(id).slice(0,3),gen(id)));return a.sort(()=>Math.random()-.5).slice(0,20)}
function makeQs(){let id=T[cur].id;qs=id=='final'?finalQs():base(id);if(qs.length<4)qs=qs.concat(gen(id));}
function render(){makeQs();let t=T[cur],s=st.stats[t.id]||{a:0,c:0},mast=s.a?Math.round(100*s.c/s.a):0;main.innerHTML=`<h1>${t.title}</h1><p><button onclick="prev()">Previous</button><button onclick="next()">Next</button><button onclick="complete()">Mark Complete</button><button onclick="newRand()">New Random Question</button></p><div class="box"><b>Lesson summary:</b> ${t.txt[0]}<br><b>Mastery:</b> ${mast}% (${s.c}/${s.a}) ${st.done[t.id]?'<span class=ok>Complete</span>':''}</div><div class="grid"><div class="card"><b>Must-know facts</b><ul>${t.txt[1].split('. ').map(x=>'<li>'+x+'</li>').join('')}</ul></div><div class="card"><b>Formula card</b><p>${form(t.id)}</p></div><div class="card"><b>Common Regents traps</b><p>${t.txt[2]}</p></div></div><div class="box"><b>Worked example</b><p>${t.txt[3]}</p></div><h2>Practice</h2><div id="qs"></div><h2>Notes</h2><textarea oninput="st.notes['${t.id}']=this.value;save()" placeholder="Autosaved notes for this topic">${st.notes[t.id]||''}</textarea>`;drawQs();nav();topbar()}
function form(id){return({survive:'m=10^-3, µ=10^-6, n=10^-9, p=10^-12; rearrange formulas before substituting.',charge:'q=ne, e=1.60×10^-19 C.',charging:'No main equation: track electron transfer and conservation of charge.',coul:'F<sub>e</sub>=kq<sub>1</sub>q<sub>2</sub>/r²; k=9.0×10^9 N·m²/C².',field:'F<sub>e</sub>=qE; E=F/q; q=F/E.',plates:'Uniform field: F=qE; field points + plate to - plate.',volt:'W=qV; V=W/q; q=W/V; 1 eV=1.60×10^-19 J.',mix:'Choose: Coulomb (two charges+r), field (q and E), or work (q and V).',final:'All formulas above; show equation, substitution, answer with units.'})[id]}
function drawQs(){qsEl=document.getElementById('qs');qsEl.innerHTML=qs.map((q,i)=>`<div class=q><b>${i+1}.</b> ${q.text}<br>${q.kind=='mc'?q.opts.map((o,j)=>`<label><input name="q${i}" type="radio" value="${j}"> ${o}</label><br>`).join(''):`<input class=ans id="a${i}" placeholder="answer"> ${q.unit||''}`}<br><button onclick="check(${i})">Check Answer</button><button onclick="hint(${i})">Show Hint</button><div id="r${i}" class="small"></div></div>`).join('')}
function val(i){let q=qs[i];if(q.kind=='mc'){let e=document.querySelector(`input[name=q${i}]:checked`);return e?e.value:''}return(document.getElementById('a'+i)||{}).value||''}function num(v){return parseFloat(String(v).replace(/×10\^/,'e').replace(/x10\^/,'e').replace(/,/g,''))}
function check(i){let q=qs[i],v=val(i),ok=false;if(q.kind=='mc')ok=+v==q.ans;else if(q.kind=='num'){let n=num(v);ok=isFinite(n)&&Math.abs(n-q.ans)<=Math.abs(q.ans)*.02}else ok=q.keys.every(k=>String(v).toLowerCase().includes(k));let id=T[cur].id;st.stats[id]=st.stats[id]||{a:0,c:0};st.stats[id].a++;if(ok)st.stats[id].c++;st.ans[id+'_'+i]=v;save();document.getElementById('r'+i).innerHTML=(ok?'<span class=ok>Correct.</span> ':'<span class=bad>Not yet.</span> ')+q.exp+(q.kind=='num'?`<br>Accepted: within 2%; unit: ${q.unit}.`:'' )}
function hint(i){document.getElementById('r'+i).innerHTML='<span class=muted>Hint: '+qs[i].hint+'</span>'}function complete(){st.done[T[cur].id]=1;save();render()}function newRand(){makeQs();drawQs()}function resetAll(){if(confirm('Erase all progress, notes, answers, and mastery?')){localStorage.removeItem(LS);st={done:{},notes:{},stats:{},ans:{}};render()}}
function exp(){let b=new Blob([JSON.stringify(st,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='regents-electrostatics-progress.json';a.click()}function imp(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{st=JSON.parse(r.result);save();render()}catch(_){alert('Bad JSON')}};r.readAsText(f)}
function dash(){let rows=T.map(t=>{let s=st.stats[t.id]||{a:0,c:0},m=s.a?Math.round(100*s.c/s.a):0;return`<tr><td><a onclick="go(${T.indexOf(t)})">${t.title}</a></td><td>${st.done[t.id]?'yes':'no'}</td><td>${m}%</td><td>${s.c}/${s.a}</td></tr>`}).join(''),weak=T.filter(t=>{let s=st.stats[t.id]||{a:0,c:0};return !s.a||s.c/s.a<.75}).map(t=>t.title).join('<br>')||'None';main.innerHTML=`<h1>Dashboard</h1><div class=box><b>Overall:</b> ${Math.round(100*Object.keys(st.done).length/T.length)}% complete<br><b>Weak topics/review order:</b><br>${weak}</div><table><tr><th>Topic</th><th>Complete</th><th>Mastery</th><th>Correct/Attempted</th></tr>${rows}</table>`;nav();topbar()}
render();
</script></body></html>
